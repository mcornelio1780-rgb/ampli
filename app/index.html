<style>
:root{--cob:#1D3FBB;--sun:#FFC83D;--ink:#14162B;--paper:#F6F7FB;--fog:#DDE3F7;--ok:#167A52;--bad:#D7263D;
--bg:var(--paper);--fg:var(--ink);--muted:#4A4F6A;--line:#CCD3EA;--card:#fff;--field:#fff;--accent:var(--cob);
--f:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1430;--fg:#F6F7FB;--muted:#AEB6D6;--line:#2A3366;--card:#161C40;--field:#0F1430;--accent:#7B93FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1430;--fg:#F6F7FB;--muted:#AEB6D6;--line:#2A3366;--card:#161C40;--field:#0F1430;--accent:#7B93FF;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--f)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;padding:12px clamp(14px,3vw,28px);border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header .logo{width:112px;display:block}
header .prod{font-weight:700;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
header .sp{flex:1}
select,input,textarea{font:inherit;color:var(--fg);background:var(--field);border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:120px;line-height:1.5}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
button{font:600 14px var(--f);border-radius:999px;padding:9px 16px;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;white-space:nowrap}
button.pri{background:var(--cob);border-color:var(--cob);color:#fff}
button.sm{padding:5px 11px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{display:flex;gap:4px;padding:10px clamp(14px,3vw,28px) 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;border-radius:8px 8px 0 0;padding:10px 16px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
main{padding:22px clamp(14px,3vw,28px) 60px;max-width:1320px;margin:0 auto}
.panel{display:none}.panel.on{display:block}
.cols{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px}
@media(max-width:960px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font:800 22px/1.15 var(--f);margin:0 0 4px}
.card h3{font:700 16px var(--f);margin:16px 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row1{margin-bottom:10px}
.phi{background:var(--fog);color:#14162B;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.codebox{border-left:4px solid var(--accent);padding:8px 12px;margin:10px 0;background:color-mix(in srgb,var(--fog) 35%,transparent);border-radius:0 8px 8px 0}
.codebox b{display:block}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.t-appeal{background:var(--cob);color:#fff}.t-corrected{background:var(--sun);color:#14162B}.t-noappeal{background:#4A4F6A;color:#fff}.t-redirect{background:var(--fog);color:#14162B}
.dl-ok{color:var(--ok);font-weight:700}.dl-warn{color:#B07A00;font-weight:700}.dl-bad{color:var(--bad);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--ok)}
.prog{height:8px;border-radius:999px;background:var(--fog);overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font:800 26px var(--f)}.kpi span{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:12px;color:var(--muted);font-weight:700}
.scroll{overflow-x:auto}
.empty{padding:36px;text-align:center;color:var(--muted)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.lib .card h3{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.quiz-opt{display:block;width:100%;text-align:left;border-radius:10px;margin:8px 0;white-space:normal;border-width:1.5px}
.quiz-opt.right{background:var(--ok);border-color:var(--ok);color:#fff}.quiz-opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);max-width:560px;width:92vw}
dialog::backdrop{background:rgba(15,20,48,.5)}
@media print{header,nav.tabs,.noprint{display:none!important}body{background:#fff;color:#000}.panel{display:none!important}.panel.print{display:block!important}}
.who{font-size:13px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.localbar{background:var(--sun);color:#14162B;font-size:13px;font-weight:600;padding:8px clamp(14px,3vw,28px)}
.sales{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--cob);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:18px;font-weight:600}
.sales .sp{flex:1}.sales button{border-color:#fff;color:#fff}.sales button.pri{background:var(--sun);border-color:var(--sun);color:#14162B}
.sales .x{border:0;font-size:18px;padding:2px 8px}
.ainote{font-size:12px;color:var(--muted);margin:-4px 0 8px;border-left:3px solid var(--sun);padding-left:8px}
.foot{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;padding:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot a{color:var(--muted)}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gate-card{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px}
.gate h1{font:800 32px/1.05 var(--f);margin:0 0 10px;letter-spacing:-.02em}
.gate p{margin:0 0 12px}
.gate-l{padding-left:18px;margin:0 0 8px}.gate-l li{margin:6px 0}
.gate .bar button{flex:1}
.gate a{color:var(--accent)}
#report{display:none}
</style>

["CO-4","corrected","modifier",["El código de procedimiento no coincide con el modificador, o falta un modificador requerido.","The procedure code is inconsistent with the modifier, or a required modifier is missing.","O código do procedimento não corresponde ao modificador, ou falta um modificador obrigatório.","Le code d’acte ne correspond pas au modificateur, ou un modificateur requis manque."],["Compara el modificador con la nota clínica, corrígelo y reenvía como reclamo corregido.","Check the modifier against the clinical note, fix it and resubmit as a corrected claim.","Confira o modificador com a nota clínica, corrija e reenvie como reembolso corrigido.","Comparez le modificateur à la note clinique, corrigez et renvoyez une demande corrigée."]],
["CO-11","appeal","dx",["El diagnóstico no es consistente con el procedimiento.","The diagnosis is inconsistent with the procedure.","O diagnóstico não é consistente com o procedimento.","Le diagnostic n’est pas cohérent avec l’acte."],["Verifica que el ICD-10 documentado respalde el CPT. Si el código estaba mal, corrige; si estaba bien, apela con la nota clínica.","Confirm the documented ICD-10 supports the CPT. Fix it if it was wrong; if it was right, appeal with the clinical note.","Confirme que o CID-10 documentado sustenta o CPT. Se estava errado, corrija; se estava certo, recorra com a nota clínica.","Vérifiez que la CIM-10 documentée justifie le CPT. Corrigez si erreur ; sinon, faites un recours avec la note clinique."]],
["CO-16","corrected","info",["Al reclamo le falta información o tiene errores de facturación.","The claim lacks information or has submission/billing errors.","Falta informação no reembolso ou há erros de faturamento.","La demande manque d’informations ou contient des erreurs de facturation."],["Lee el RARC que acompaña (por ejemplo N290 o MA130): dice exactamente qué falta. Completa y reenvía.","Read the accompanying RARC (e.g. N290, MA130): it says exactly what is missing. Complete and resubmit.","Leia o RARC que acompanha (ex.: N290, MA130): ele diz exatamente o que falta. Complete e reenvie.","Lisez le RARC associé (ex. N290, MA130) : il indique ce qui manque. Complétez et renvoyez."]],
["CO-18","appeal","duplicate",["Reclamo o servicio duplicado.","Exact duplicate claim or service.","Reembolso ou serviço duplicado.","Demande ou acte en double."],["Confirma si de verdad es un duplicado. Si fueron servicios distintos, apela con el modificador correcto (76, 77, 59) y la documentación.","Confirm whether it truly is a duplicate. If services were distinct, appeal with the right modifier (76, 77, 59) and documentation.","Confirme se é mesmo duplicado. Se foram serviços distintos, recorra com o modificador correto (76, 77, 59) e a documentação.","Vérifiez s’il s’agit vraiment d’un doublon. Si les actes sont distincts, recours avec le bon modificateur (76, 77, 59) et les pièces."]],
["CO-22","corrected","cob",["El servicio puede estar cubierto por otro seguro (coordinación de beneficios).","This care may be covered by another payer per coordination of benefits.","O serviço pode estar coberto por outro seguro (coordenação de benefícios).","L’acte peut être couvert par un autre payeur (coordination des prestations)."],["Verifica cuál es el seguro primario. Envía la EOB del primario o pide al paciente que actualice su COB con la aseguradora.","Confirm which plan is primary. Send the primary EOB or ask the patient to update COB with the payer.","Verifique qual é o seguro primário. Envie a EOB do primário ou peça ao paciente para atualizar a COB.","Identifiez l’assureur principal. Envoyez son EOB ou demandez au patient de mettre à jour la COB."]],
["CO-27","appeal","eligibility",["Gastos incurridos después de que terminó la cobertura.","Expenses incurred after coverage terminated.","Despesas após o término da cobertura.","Frais engagés après la fin de la couverture."],["Verifica elegibilidad en la fecha de servicio. Si había cobertura, apela con la prueba; si no, factura al paciente o al nuevo seguro.","Check eligibility on the date of service. If covered, appeal with proof; if not, bill the patient or the new plan.","Verifique a elegibilidade na data do serviço. Se havia cobertura, recorra com a prova; se não, cobre o paciente ou o novo plano.","Vérifiez l’éligibilité à la date de l’acte. Si couvert, recours avec preuve ; sinon, facturez le patient ou le nouveau plan."]],
["CO-29","appeal","timely",["Venció el plazo para presentar el reclamo.","The time limit for filing has expired.","O prazo para apresentar o reembolso venceu.","Le délai de dépôt de la demande est dépassé."],["Busca la prueba de envío a tiempo (reporte de aceptación del clearinghouse o carta de rechazo previa) y apela con ella.","Find proof of timely filing (clearinghouse acceptance report or earlier rejection letter) and appeal with it.","Busque a prova de envio no prazo (relatório de aceitação do clearinghouse) e recorra com ela.","Trouvez la preuve de dépôt dans les délais (rapport d’acceptation du clearinghouse) et faites un recours."]],
["CO-31","corrected","eligibility",["No se puede identificar al paciente como asegurado.","Patient cannot be identified as our insured.","Não é possível identificar o paciente como segurado.","Le patient n’est pas identifié comme assuré."],["Compara nombre, fecha de nacimiento e ID de miembro con la tarjeta del seguro. Corrige y reenvía.","Compare name, date of birth and member ID against the insurance card. Fix and resubmit.","Compare nome, data de nascimento e ID do membro com a carteirinha. Corrija e reenvie.","Comparez nom, date de naissance et ID membre avec la carte d’assurance. Corrigez et renvoyez."]],
["CO-45","noappeal","generic",["El cargo supera la tarifa contratada: es un ajuste contractual.","Charge exceeds fee schedule / maximum allowable: contractual adjustment.","O valor excede a tabela contratada: é um ajuste contratual.","Le montant dépasse le barème contractuel : ajustement contractuel."],["Normalmente no se apela. Solo si pagaron menos de lo contratado, apela con el anexo de tarifas.","Usually not appealable. Only if paid below contract, appeal with the fee schedule.","Normalmente não se recorre. Só se pagaram menos que o contrato, recorra com a tabela.","En général pas de recours. Seulement si le paiement est inférieur au contrat, avec le barème."]],
["CO-50","appeal","necessity",["No se considera médicamente necesario.","Not deemed a medical necessity by the payer.","Não considerado clinicamente necessário.","Non jugé médicalement nécessaire."],["Apela con notas clínicas, historia de tratamientos previos y la política de cobertura (LCD/NCD o la del pagador) que respalda el servicio.","Appeal with clinical notes, prior treatment history and the coverage policy (LCD/NCD or payer policy) that supports the service.","Recorra com notas clínicas, histórico de tratamentos e a política de cobertura (LCD/NCD ou do pagador).","Recours avec notes cliniques, historique des traitements et la politique de couverture (LCD/NCD ou du payeur)."]],
["CO-96","appeal","noncovered",["Cargo no cubierto por el plan.","Non-covered charge(s).","Cobrança não coberta pelo plano.","Frais non couverts par le plan."],["Confirma beneficios. Si el servicio sí es cubierto o tenía autorización, apela; si no, revisa si hay un ABN o renuncia firmada para cobrar al paciente.","Verify benefits. If covered or authorized, appeal; if not, check for a signed ABN/waiver to bill the patient.","Confirme os benefícios. Se coberto ou autorizado, recorra; se não, veja se há ABN/termo assinado para cobrar o paciente.","Vérifiez les garanties. Si couvert ou autorisé, recours ; sinon, vérifiez un ABN signé pour facturer le patient."]],

  const st=t("st");
  $("tbl").innerHTML=`<tr><th>${t("hRef")}</th><th>${t("hPayer")}</th><th>${t("hCode")}</th><th>${t("hAmt")}</th><th>${t("hDl")}</th><th>${t("hStatus")}</th><th>${t("hAct")}</th></tr>`+rows.map(c=>{const d=deadline(c.den,c.ptype);const dl=!d?"—":d.left<0?`<span class="dl-bad">−${-d.left}d</span>`:`<span class="${d.left<=7?"dl-bad":d.left<=30?"dl-warn":"dl-ok"}">${d.left}d</span>`;
  return `<tr><td>${esc(c.ref)}<div class="hint">${esc(c.claim)}</div></td><td>${esc(c.payer)}</td><td><span class="tag t-${codeOf(c.code)?.[1]||"redirect"}">${esc(c.code)}</span></td><td>${fmt(c.amt)}</td><td>${dl}</td><td><select data-id="${c.id}" class="stSel" aria-label="${t("hStatus")}">${Object.keys(st).map(k=>`<option value="${k}" ${c.status===k?"selected":""}>${esc(st[k])}</option>`).join("")}</select></td><td style="white-space:nowrap"><button class="sm" data-open="${c.id}">${esc(t("open"))}</button> <button class="sm" data-del="${c.id}">${esc(t("del"))}</button></td></tr>`}).join("");
  document.querySelectorAll(".stSel").forEach(s=>s.onchange=()=>{const c=S.claims.find(x=>x.id===s.dataset.id);c.status=s.value;store.set(S);renderQueue()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.claims=S.claims.filter(x=>x.id!==b.dataset.del);store.set(S);renderQueue()});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const c=S.claims.find(x=>x.id===b.dataset.open);$("dlgT").textContent=`${c.code} · ${c.ref}`;$("dlgB").innerHTML=`<textarea readonly style="min-height:300px;font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(c.letter)}</textarea>`;$("dlg").showModal()});
}
const COLS=["id","ref","claim","payer","ptype","code","rarc","cpt","amt","dos","den","facts","status","created","letter"];
function toCSV(){return COLS.join(",")+"\n"+S.claims.map(c=>COLS.map(k=>`"${String(c[k]??"").replace(/"/g,'""')}"`).join(",")).join("\n")}
function parseCSV(txt){const rows=[];let r=[],f="",q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else{if(ch==='"')q=true;else if(ch===","){r.push(f);f=""}else if(ch==="\n"){r.push(f);rows.push(r);r=[];f=""}else if(ch!=="\r")f+=ch}}if(f||r.length){r.push(f);rows.push(r)}return rows}
function dl(name,txt,type){const u=URL.createObjectURL(new Blob([txt],{type}));const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function report(){
  const L=S.claims,st=S.settings||{};const by={};L.forEach(c=>{by[c.code]=by[c.code]||{n:0,a:0};by[c.code].n++;by[c.code].a+=c.amt});
  const won=L.filter(c=>c.status==="won").reduce((s,c)=>s+c.amt,0),open=L.filter(c=>!["won","lost","billed"].includes(c.status)).reduce((s,c)=>s+c.amt,0);
  $("report").innerHTML=`<div style="max-width:760px;margin:0 auto;font-family:var(--f)"><div style="width:160px">${document.querySelector("header .logo").innerHTML}</div><h1 style="font:800 30px var(--f)">${esc(t("reportTitle"))}</h1><p>${esc(st.clinic||"")} · ${new Date().toLocaleDateString()}</p>
  <table class="tbl"><tr><th>${t("kTotal")}</th><td>${L.length}</td></tr><tr><th>${t("kStake")}</th><td>${fmt(open)}</td></tr><tr><th>${t("kWon")}</th><td>${fmt(won)}</td></tr></table>
  <h2 style="font:700 20px var(--f);margin-top:24px">CARC</h2><table class="tbl"><tr><th>${t("hCode")}</th><th>#</th><th>${t("hAmt")}</th><th>${t("hAct")}</th></tr>${Object.entries(by).sort((a,b)=>b[1].a-a[1].a).map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${fmt(v.a)}</td><td>${esc(codeOf(k)?.[4][LI[S.lang]]||"")}</td></tr>`).join("")}</table>
  <p class="hint" style="margin-top:24px">Ampli Desk · ✓ ${esc(I[S.lang].ck[0])}</p></div>`;
  window.print();
}
// ---------- biblioteca ----------
function renderLib(){const q=($("cq").value||"").toLowerCase(),li=LI[S.lang];
  $("lib").innerHTML=C.filter(c=>!q||(c[0]+c[3][li]+c[4][li]).toLowerCase().includes(q)).map(c=>`<div class="card"><h3>${c[0]} <span class="tag t-${c[1]}">${esc(t("types")[c[1]])}</span></h3><p style="margin:0 0 8px">${esc(c[3][li])}</p><p class="hint" style="margin:0">→ ${esc(c[4][li])}</p></div>`).join("")}
// ---------- práctica ----------
let QZ={i:0,score:0,done:false};
function renderQuiz(){const li=LI[S.lang],box=$("quiz");
  if(QZ.i>=PRACT.length){box.innerHTML=`<p style="font:800 28px var(--f)">${esc(t("score"))}: ${QZ.score}/${PRACT.length}</p><button class="pri" id="qr">${esc(t("restart"))}</button>`;$("qr").onclick=()=>{QZ={i:0,score:0,done:false};renderQuiz()};return}
  const p=PRACT[QZ.i];box.innerHTML=`<p class="hint">${QZ.i+1}/${PRACT.length} · ${esc(t("score"))}: ${QZ.score}</p><p style="font-weight:600;font-size:17px">${esc(p.q[li])}</p>`+p.o.map((o,k)=>`<button class="quiz-opt" data-k="${k}">${esc(o[li])}</button>`).join("")+`<p id="qe" class="hint" aria-live="polite"></p><button id="qn" class="pri" hidden>${esc(t("next"))}</button>`;
  box.querySelectorAll(".quiz-opt").forEach(b=>b.onclick=()=>{if(QZ.done)return;QZ.done=true;const k=+b.dataset.k;if(k===p.a)QZ.score++;box.querySelectorAll(".quiz-opt").forEach(x=>{if(+x.dataset.k===p.a)x.classList.add("right");else if(x===b)x.classList.add("wrong")});$("qe").textContent=p.e[li];$("qn").hidden=false});
  $("qn").onclick=()=>{QZ.i++;QZ.done=false;renderQuiz()};
}
// ---------- eventos ----------
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+b.dataset.tab))});
$("lang").onchange=e=>{S.lang=e.target.value;A.setLang(S.lang);store.set(S);applyLang();renderSales()};
["f-code","f-den","f-ptype"].forEach(id=>$(id).addEventListener("change",renderCodeInfo));
$("genBtn").onclick=()=>{const f=form();if(!f.code){toast(t("fill"));$("f-code").focus();return}$("letter").value=buildLetter(f);$("checks").querySelectorAll("input").forEach(x=>x.checked=false);updChecks();$("letter").scrollTop=0;$("letter").focus({preventScroll:true});A.track("letter_generated",{code:f.code,ptype:f.ptype})};
$("letter").addEventListener("input",updChecks);
$("copyLetter").onclick=()=>copy($("letter").value);
$("dlLetter").onclick=()=>dl(`appeal_${form().claim||"draft"}.txt`,$("letter").value,"text/plain");
$("copyPrompt").onclick=()=>{const f=form();if(!f.code){toast(t("fill"));return}if(!$("letter").value)$("letter").value=buildLetter(f);copy(buildPrompt(f))};
$("demoBtn").onclick=()=>{const d=new Date();const iso=x=>{const z=new Date(d);z.setDate(z.getDate()-x);return z.toISOString().slice(0,10)};
  Object.entries({"f-ref":"J.R. · INT-0042","f-claim":"2026110400123","f-payer":"UnitedHealthcare","f-ptype":"commercial","f-code":"CO-197","f-rarc":"N54","f-cpt":"73721","f-amt":"1240","f-dos":iso(38),"f-den":iso(12),"f-facts":"Authorization A55120 approved 3 days before the date of service (screenshot from payer portal).\nOrdering physician note documents 6 weeks of knee pain unresolved with physical therapy."}).forEach(([k,v])=>$(k).value=v);
  if(!S.settings.clinic){S.settings={clinic:"Sunrise Family Clinic",addr:"1200 Main St, Austin, TX 78701",npi:"1234567890",tin:"XX-XXXXXXX",op:"Valentina Rojas",phone:"(512) 555-0100"};store.set(S);loadSettings()}
  renderCodeInfo();$("genBtn").click()};
$("clearBtn").onclick=()=>{document.querySelectorAll("#p-new input,#p-new textarea,#p-new select").forEach(x=>{if(x.tagName==="SELECT")x.selectedIndex=0;else x.value=""});$("letter").value="";renderCodeInfo();renderChecks()};
$("saveBtn").onclick=()=>{const f=form();S.claims.unshift(Object.assign(f,{id:Date.now().toString(36),status:"review",created:new Date().toISOString().slice(0,10),letter:$("letter").value}));store.set(S);toast(t("saved"));A.track("claim_saved",{code:f.code});$("clearBtn").click();renderQueue()};
$("q").oninput=renderQueue;$("cq").oninput=renderLib;
$("csvBtn").onclick=()=>dl("ampli_desk_claims.csv","\ufeff"+toCSV(),"text/csv");
$("impBtn").onclick=()=>$("csvIn").click();
$("csvIn").onchange=async e=>{const file=e.target.files[0];if(!file)return;const rows=parseCSV((await file.text()).replace(/^\ufeff/,""));const h=rows.shift()||[];let n=0;rows.forEach(r=>{if(r.length<3)return;const o={};h.forEach((k,i)=>o[k]=r[i]);o.amt=parseFloat(o.amt)||0;o.id=o.id||Math.random().toString(36).slice(2);if(!S.claims.some(x=>x.id===o.id)){S.claims.push(o);n++}});store.set(S);renderQueue();toast(t("imported").replace("{n}",n));e.target.value=""};
$("reportBtn").onclick=()=>{A.track("report_printed",{n:S.claims.length});report()};
function loadSettings(){const s=S.settings||{};[["s-clinic","clinic"],["s-addr","addr"],["s-npi","npi"],["s-tin","tin"],["s-op","op"],["s-phone","phone"]].forEach(([id,k])=>$(id).value=s[k]||"")}
$("saveSet").onclick=async()=>{S.settings={clinic:$("s-clinic").value.trim(),addr:$("s-addr").value.trim(),npi:$("s-npi").value.trim(),tin:$("s-tin").value.trim(),op:$("s-op").value.trim(),phone:$("s-phone").value.trim()};store.set(S);
  if(A.user()){await A.saveProfile({practice_name:S.settings.clinic,practice_addr:S.settings.addr,npi:S.settings.npi,tin:S.settings.tin,operator_name:S.settings.op,phone:S.settings.phone,lang:S.lang})}
  toast(t("settingsSaved"))};
$("wipe").onclick=()=>{if(confirm(t("confirmWipe"))){S={lang:S.lang,claims:[],settings:{}};store.set(S);loadSettings();renderQueue();}};
const root=document.documentElement;
$("themeBtn").onclick=()=>{const d=root.dataset.theme==="dark"||(!root.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);root.dataset.theme=d?"light":"dark"};
window.addEventListener("afterprint",()=>{$("report").innerHTML=""});
function renderSales(){
  const p=A.profile(),role=(p&&p.role)||"student",box=$("sales");
  let hidden=false;try{hidden=sessionStorage.getItem("ampli_sales_x")==="1"}catch(e){}
  if(hidden){box.hidden=true;return}
  const clinic=role==="clinic"||role==="billing";
  $("salesTxt").textContent=clinic?t("sbClinic"):t("sbStudent");
  $("salesBtns").innerHTML=clinic?`<button class="sm pri" data-buy="pilot">${esc(t("sbPilot"))}</button>`:`<button class="sm pri" data-buy="cohort">${esc(t("sbCohort"))}</button> <button class="sm" data-buy="kit">${esc(t("sbKit"))}</button>`;
  box.hidden=false;
}
$("sales").addEventListener("click",e=>{const b=e.target.closest("[data-buy]");if(b)A.buy(b.dataset.buy)});
$("salesX").onclick=()=>{try{sessionStorage.setItem("ampli_sales_x","1")}catch(e){}$("sales").hidden=true};
$("gSignup").onclick=()=>A.openAuth("signup");
$("gLogin").onclick=()=>A.openAuth("login");
$("outBtn").onclick=()=>A.signOut().then(()=>location.reload());
function boot(){
  const u=A.user();
  K=u?K0+":"+u.id:K0;
  let data=store.get();
  if(u&&!data.claims){try{const legacy=JSON.parse(localStorage.getItem(K0)||"null");if(legacy&&legacy.claims&&legacy.claims.length&&!localStorage.getItem(K0+":adopted")){data=legacy;localStorage.setItem(K0+":adopted",u.id)}}catch(e){}}
  S=Object.assign({claims:[],settings:{}},data,{lang:S.lang});
  const p=A.profile();
  if(p&&!(S.settings&&S.settings.clinic)&&(p.practice_name||p.operator_name)){S.settings={clinic:p.practice_name||"",addr:p.practice_addr||"",npi:p.npi||"",tin:p.tin||"",op:p.operator_name||p.full_name||"",phone:p.phone||""};store.set(S)}
  if(p&&!(S.settings&&S.settings.op)&&p.full_name){S.settings=Object.assign({},S.settings,{op:p.full_name})}
  $("who").hidden=!u;$("outBtn").hidden=!u;if(u){$("who").textContent=(p&&p.full_name)||u.email;$("who").title=u.email}
  $("localBar").hidden=true;$("localBar").textContent=t("localMode");
  const gate=A.enabled&&CFG.requireLogin!==false&&!u;
  const vgate=A.enabled&&!!u&&u.verified===false&&CFG.requireEmailVerified!==false;
  $("gate").hidden=!gate;$("vgate").hidden=!vgate||gate;document.body.style.overflow=(gate||vgate)?"hidden":"";
  if(vgate){$("vText").textContent=t("vText").replace("{e}",u.email)}
  loadSettings();applyLang();renderSales();
  if(new URLSearchParams(location.search).get("reset")==="1"&&u)A.openAuth("newpass");
}
$("vDone").onclick=async()=>{$("vMsg").textContent="…";const u=await A.reloadUser();if(u&&u.verified){$("vMsg").textContent="";boot()}else{$("vMsg").textContent=t("vNot")}};
$("vResend").onclick=async()=>{try{await A.resendVerification();$("vMsg").textContent=t("vSent")}catch(e){$("vMsg").textContent=A.t("errRate")}};
$("vOut").onclick=()=>A.signOut().then(()=>location.reload());
A.ready.then(boot);
let lastKey=null;A.onAuth(c=>{const k=c.user?c.user.id+":"+c.user.verified:null;if(k!==lastKey){lastKey=k;boot()}});

</script>
