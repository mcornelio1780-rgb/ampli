[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.65 var(--r)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

header .w{max-width:900px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--f)}

nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
nav.tabs a.on{color:var(--fg);border-color:var(--cob)}
main{max-width:900px;margin:0 auto;padding:28px 20px 80px}

.meta{font:500 14px var(--f);color:var(--muted)}
.note{font:500 14px/1.5 var(--f);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sun);padding:12px 14px;border-radius:10px;margin:18px 0}
section{display:none}section.on{display:block}
footer{font:500 13px var(--f);color:var(--muted);text-align:center;padding:24px;border-top:1px solid var(--line)}

const L={

terms:[["1. Quiénes somos","Ampli es una marca de {entity}, sociedad registrada en {state}, con domicilio en {address}. Contacto: {email}."],
["2. Qué ofrecemos","Formación en línea (cohortes en vivo y materiales), la herramienta Ampli Desk y servicios de apoyo a clínicas y empresas de facturación médica en EE.UU. Ampli es un programa educativo y de servicios: no es una certificación oficial de AAPC, AHIMA ni de ningún organismo público."],
["3. Sin promesa de empleo ni ingresos","No garantizamos empleo, contratos ni ingresos. Los resultados dependen de cada persona y del mercado. Cualquier ejemplo de ingresos o casos es ilustrativo."],
["4. Cuentas","Debes tener 18 años o más y dar datos verdaderos. Eres responsable de tu contraseña y de la actividad de tu cuenta. Podemos suspender cuentas que incumplan estos términos."],
["5. Uso permitido de Ampli Desk","Ampli Desk prepara borradores. Tú eres responsable de verificar cada dato antes de enviarlo a una aseguradora. No ingreses nombres de pacientes ni información de salud identificable: usa iniciales o IDs internos. Los reclamos se guardan solo en tu navegador; haz copias con la exportación CSV."],
["6. Pagos y reembolsos","Los pagos se procesan a través de Polar, que actúa como comerciante registrado (Merchant of Record) y emite el comprobante. Cohorte: puedes pedir reembolso completo hasta antes de la segunda sesión en vivo. Kit digital: reembolso dentro de 7 días si no lo descargaste. Piloto para clínicas: reembolso completo si no hemos empezado la revisión. Escribe a {email}."],
["7. Propiedad intelectual","Los materiales, la marca, el logo y el software son de {entity}. Tienes una licencia personal e intransferible para usarlos durante tu formación o servicio. No puedes revenderlos ni redistribuirlos."],
["8. Limitación de responsabilidad","Los servicios se ofrecen tal cual. En la medida que permita la ley, {entity} no responde por decisiones de aseguradoras, plazos vencidos ni pérdidas indirectas. Nuestra responsabilidad máxima se limita a lo que pagaste en los últimos 12 meses."],
["9. Cambios y ley aplicable","Podemos actualizar estos términos y avisaremos los cambios importantes. Se rigen por las leyes de {state}, EE.UU., sin perjuicio de los derechos de consumidor que te otorgue la ley de tu país."]],
privacy:[["1. Responsable","{entity} ({address}) es responsable del tratamiento de tus datos. Contacto de privacidad: {email}."],
["2. Qué datos recogemos","Datos que nos das en formularios (nombre, correo, país, nivel de inglés, ocupación, consultorio, estado, preguntas), datos de cuenta (correo, nombre, rol, idioma, datos del consultorio que tú escribas) y eventos de uso de Ampli Desk sin información de pacientes (por ejemplo, \"carta generada\" y el código de rechazo). Los pagos los procesa Polar: no recibimos los datos de tu tarjeta."],
["3. Qué NO recogemos","Los reclamos que registras en Ampli Desk se guardan solo en tu navegador (almacenamiento local) y no se envían a nuestros servidores. Pedimos no ingresar datos de salud identificables."],
["4. Para qué los usamos","Responder tus solicitudes, crear y gestionar tu cuenta, darte acceso a la formación y a la herramienta, enviarte información que pediste, mejorar el producto y cumplir obligaciones legales. Solo enviamos novedades si marcaste la casilla correspondiente."],
["5. Base legal","Tu consentimiento (formularios y comunicaciones), la ejecución del contrato (cuenta y compras), nuestro interés legítimo (seguridad y mejora del servicio) y obligaciones legales."],
["6. Con quién los compartimos","Proveedores que nos prestan servicios: Firebase de Google (base de datos y cuentas), Polar (pagos), FormSubmit (envío de formularios por correo mientras no hay base de datos activa), Google (si inicias sesión con Google) y el proveedor de alojamiento web. No vendemos tus datos."],
["7. Transferencias internacionales","Nuestros proveedores pueden almacenar datos en EE.UU. u otros países. Usamos proveedores con garantías contractuales de protección de datos."],
["8. Cuánto tiempo","Mientras tu cuenta esté activa y hasta 24 meses después del último contacto, salvo que la ley exija más. Puedes pedir la eliminación antes."],
["9. Tus derechos","Puedes acceder, rectificar, eliminar, oponerte, limitar y portar tus datos, y retirar tu consentimiento en cualquier momento escribiendo a {email}. Estos derechos se reconocen, entre otras, en el RGPD (UE), la LGPD (Brasil), la Ley 29733 (Perú, derechos ARCO), la Ley 25 (Quebec), la PIPEDA (Canadá) y la CCPA/CPRA (California). También puedes reclamar ante la autoridad de protección de datos de tu país."],
["10. Seguridad, menores y cookies","Usamos cifrado en tránsito y reglas de acceso por fila en la base de datos. El servicio es solo para mayores de 18 años. Solo usamos almacenamiento técnico necesario (sesión, idioma, borradores locales); no usamos cookies de publicidad."]],
ai:[["1. Cómo usamos la IA","Usamos modelos de IA y plantillas para redactar borradores de cartas de apelación, materiales de estudio y contenido. La IA nunca toma decisiones finales: una persona entrenada revisa cada entregable con un checklist de verificación de 8 puntos."],
["2. Transparencia","Indicamos cuando un texto es un borrador generado automáticamente. Ampli Desk lo muestra junto a cada carta. Si interactúas con un asistente automatizado, te lo diremos."],
["3. Supervisión humana","Ninguna carta se guarda como lista sin completar el checklist humano. No usamos IA para tomar decisiones automatizadas con efectos legales o significativos sobre personas, como admisión, calificación final o contratación."],
["4. Datos y privacidad","No subimos datos de pacientes ni información de salud identificable a herramientas de IA. Antes de procesar datos de salud de clínicas, firmaremos acuerdos de socio comercial (BAA, HIPAA) con cada proveedor involucrado. El prompt que genera Ampli Desk está anonimizado."],
["5. Límites conocidos","La IA puede equivocarse con códigos, fechas o pruebas, o inventar información. Por eso la regla es: si un dato no está en un documento, no va en la carta."],
["6. Marco regulatorio que seguimos","Alineamos nuestras prácticas con los principios de transparencia y supervisión humana del Reglamento (UE) 2024/1689 de Inteligencia Artificial, el artículo 22 del RGPD sobre decisiones automatizadas, el Marco de Gestión de Riesgos de IA del NIST (EE.UU.), la Ley 31814 de Perú que promueve el uso de la IA, la LGPD de Brasil y las leyes de protección al consumidor y de privacidad de EE.UU. y Canadá. Revisamos esta política cuando cambian las normas de los países donde operamos."],
["7. Consultas y reclamos","Si tienes dudas sobre el uso de IA o crees que un resultado te afectó, escríbenos a {email}. Respondemos en un plazo máximo de 15 días hábiles."]]},

terms:[["1. Who we are","Ampli is a brand of {entity}, a company registered in {state}, located at {address}. Contact: {email}."],
["2. What we offer","Online training (live cohorts and materials), the Ampli Desk tool and support services for US clinics and medical billing companies. Ampli is an educational and services program, not an official AAPC, AHIMA or government certification."],
["3. No promise of jobs or income","We don’t guarantee employment, contracts or income. Results depend on each person and on the market. Any income or case examples are illustrative."],
["4. Accounts","You must be 18 or older and provide accurate information. You are responsible for your password and account activity. We may suspend accounts that breach these terms."],
["5. Permitted use of Ampli Desk","Ampli Desk prepares drafts. You are responsible for verifying every fact before sending anything to a payer. Do not enter patient names or identifiable health information: use initials or internal IDs. Claims are stored only in your browser; back them up with the CSV export."],
["6. Payments and refunds","Payments are processed by Polar, acting as Merchant of Record and issuing the receipt. Cohort: full refund until before the second live session. Digital kit: refund within 7 days if not downloaded. Practice pilot: full refund if the review hasn’t started. Email {email}."],
["7. Intellectual property","Materials, brand, logo and software belong to {entity}. You get a personal, non-transferable license to use them during your training or service. You may not resell or redistribute them."],
["8. Limitation of liability","Services are provided as is. To the extent permitted by law, {entity} is not liable for payer decisions, missed deadlines or indirect losses. Our maximum liability is limited to what you paid in the last 12 months."],
["9. Changes and governing law","We may update these terms and will announce material changes. They are governed by the laws of {state}, USA, without prejudice to consumer rights granted by your country’s law."]],
privacy:[["1. Controller","{entity} ({address}) is the data controller. Privacy contact: {email}."],
["2. Data we collect","Data you give us in forms (name, email, country, English level, occupation, practice, state, questions), account data (email, name, role, language, practice details you enter) and Ampli Desk usage events without patient information (for example, “letter generated” and the denial code). Payments are processed by Polar: we never receive your card details."],
["3. What we do NOT collect","Claims you log in Ampli Desk are stored only in your browser (local storage) and are not sent to our servers. We ask you not to enter identifiable health data."],
["4. Why we use it","To answer your requests, create and manage your account, give you access to training and the tool, send information you asked for, improve the product and meet legal obligations. We only send updates if you ticked that box."],
["5. Legal basis","Your consent (forms and communications), performance of a contract (account and purchases), our legitimate interest (security and service improvement) and legal obligations."],
["6. Who we share it with","Service providers: Google Firebase (database and accounts), Polar (payments), FormSubmit (form delivery by email while no database is active), Google (if you sign in with Google) and our web host. We don’t sell your data."],
["7. International transfers","Our providers may store data in the US or other countries. We use providers with contractual data-protection safeguards."],
["8. Retention","While your account is active and up to 24 months after your last contact, unless the law requires longer. You can request deletion earlier."],
["9. Your rights","You can access, correct, delete, object to, restrict and port your data, and withdraw consent at any time by emailing {email}. These rights are recognized by, among others, the GDPR (EU), LGPD (Brazil), Law 29733 (Peru, ARCO rights), Law 25 (Quebec), PIPEDA (Canada) and CCPA/CPRA (California). You may also complain to your local data protection authority."],
["10. Security, minors and cookies","We use encryption in transit and row-level access rules in the database. The service is for adults 18+. We only use technically necessary storage (session, language, local drafts); no advertising cookies."]],
ai:[["1. How we use AI","We use AI models and templates to draft appeal letters, study materials and content. AI never makes final decisions: a trained person reviews every deliverable with an 8-point verification checklist."],
["2. Transparency","We disclose when a text is an automatically generated draft. Ampli Desk shows this next to every letter. If you interact with an automated assistant, we will tell you."],
["3. Human oversight","No letter is saved as ready until the human checklist is complete. We don’t use AI for automated decisions with legal or similarly significant effects on people, such as admission, final grading or hiring."],
["4. Data and privacy","We never put patient data or identifiable health information into AI tools. Before processing clinics’ health data we will sign Business Associate Agreements (BAA, HIPAA) with every provider involved. The prompt produced by Ampli Desk is de-identified."],
["5. Known limits","AI can get codes, dates or evidence wrong, or invent information. Our rule: if a fact isn’t in a document, it doesn’t go in the letter."],
["6. Regulatory framework we follow","We align our practices with the transparency and human-oversight principles of Regulation (EU) 2024/1689 on Artificial Intelligence, GDPR Article 22 on automated decisions, the NIST AI Risk Management Framework (US), Peru’s Law 31814 promoting the use of AI, Brazil’s LGPD and US and Canadian consumer-protection and privacy laws. We review this policy when the rules change in the countries where we operate."],
["7. Questions and complaints","If you have questions about our use of AI or believe an output affected you, email {email}. We reply within 15 business days at most."]]},

privacy:[["1. Controlador","A {entity} ({address}) é a controladora dos seus dados. Contato de privacidade: {email}."],
["2. Dados que coletamos","Dados informados em formulários (nome, e-mail, país, nível de inglês, ocupação, consultório, estado, perguntas), dados de conta (e-mail, nome, perfil, idioma, dados do consultório que você inserir) e eventos de uso do Ampli Desk sem informação de pacientes (por exemplo, \"carta gerada\" e o código de negativa). Os pagamentos são processados pela Polar: não recebemos os dados do seu cartão."],

["4. Para que usamos","Responder suas solicitações, criar e gerenciar sua conta, dar acesso à formação e à ferramenta, enviar informações solicitadas, melhorar o produto e cumprir obrigações legais. Só enviamos novidades se você marcou a opção."],

["6. Com quem compartilhamos","Fornecedores de serviço: Firebase do Google (banco de dados e contas), Polar (pagamentos), FormSubmit (envio de formulários por e-mail enquanto não há banco de dados ativo), Google (se você entrar com o Google) e a hospedagem do site. Não vendemos seus dados."],

["9. Seus direitos","Você pode acessar, corrigir, excluir, se opor, limitar e portar seus dados, e revogar o consentimento a qualquer momento pelo e-mail {email}. Esses direitos são reconhecidos, entre outras, pela LGPD (Brasil), o RGPD (UE), a Lei 29733 (Peru), a Lei 25 (Quebec), a PIPEDA (Canadá) e a CCPA/CPRA (Califórnia). Você também pode reclamar à ANPD ou à autoridade do seu país."],
["10. Segurança, menores e cookies","Usamos criptografia em trânsito e regras de acesso por linha no banco de dados. O serviço é só para maiores de 18 anos. Usamos apenas armazenamento técnico necessário (sessão, idioma, rascunhos locais); sem cookies de publicidade."]],
ai:[["1. Como usamos a IA","Usamos modelos de IA e modelos de texto para redigir rascunhos de cartas de recurso, materiais de estudo e conteúdo. A IA nunca toma decisões finais: uma pessoa treinada revisa cada entrega com um checklist de verificação de 8 pontos."],
["2. Transparência","Informamos quando um texto é um rascunho gerado automaticamente. O Ampli Desk mostra isso junto a cada carta. Se você interagir com um assistente automatizado, avisaremos."],
["3. Supervisão humana","Nenhuma carta é salva como pronta sem o checklist humano completo. Não usamos IA para decisões automatizadas com efeitos jurídicos ou significativos sobre pessoas, como admissão, nota final ou contratação."],
["4. Dados e privacidade","Nunca colocamos dados de pacientes nem informações de saúde identificáveis em ferramentas de IA. Antes de tratar dados de saúde de clínicas, assinaremos acordos de associado comercial (BAA, HIPAA) com cada fornecedor envolvido. O prompt gerado pelo Ampli Desk é anonimizado."],
["5. Limites conhecidos","A IA pode errar códigos, datas ou provas, ou inventar informações. Nossa regra: se um dado não está num documento, não entra na carta."],
["6. Marco regulatório que seguimos","Alinhamos nossas práticas aos princípios de transparência e supervisão humana do Regulamento (UE) 2024/1689 sobre Inteligência Artificial, ao artigo 22 do RGPD e ao art. 20 da LGPD sobre decisões automatizadas, ao Marco de Gestão de Riscos de IA do NIST (EUA), à Lei 31814 do Peru e às leis de proteção ao consumidor e privacidade dos EUA e do Canadá. Acompanhamos o projeto de lei brasileiro de IA (PL 2338/2023) e revisamos esta política quando as normas mudam."],
["7. Dúvidas e reclamações","Se tiver dúvidas sobre o uso de IA ou achar que um resultado afetou você, escreva para {email}. Respondemos em até 15 dias úteis."]]},

let lang=L[A.lang()]?A.lang():"es";
const esc=A.esc;
const fill=s=>esc(s).replace(/\{entity\}/g,esc(CFG.legalEntity||"Limly LLC")).replace(/\{state\}/g,esc(CFG.legalState||"—")).replace(/\{address\}/g,esc(CFG.legalAddress||"—")).replace(/\{email\}/g,`<a href="mailto:${esc(CFG.contactEmail||"")}">${esc(CFG.contactEmail||"")}</a>`);
function render(){
  const d=L[lang];document.documentElement.lang=lang;document.getElementById("lang").value=lang;
  const cur=(location.hash||"#terms").slice(1);const key=["terms","privacy","ai"].includes(cur)?cur:"terms";
  document.querySelectorAll("nav.tabs a").forEach(a=>{a.textContent=d.tabs[a.dataset.k];a.classList.toggle("on",a.dataset.k===key)});
  document.getElementById("main").innerHTML=["terms","privacy","ai"].map(k=>`<section id="s-${k}" class="${k===key?"on":""}"><h1>${esc(d.tabs[k])}</h1><p class="meta">${esc(d.upd)}: ${esc(CFG.legalUpdated||"")}</p><div class="note">${esc(d.draft)}</div>${d[k].map(x=>`<h2>${esc(x[0])}</h2><p>${fill(x[1])}</p>`).join("")}</section>`).join("");
  document.getElementById("foot").innerHTML=`© 2026 ${esc(CFG.legalEntity||"Limly LLC")} · <a href="../">${esc(d.back)}</a>`;
  document.title="Ampli · "+d.tabs[key];
}
document.getElementById("lang").onchange=e=>{lang=e.target.value;A.setLang(lang);render()};
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
</script>
